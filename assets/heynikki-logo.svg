<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="HeyNikki — Nikki Technologies">
  <title>HeyNikki — Nikki Technologies</title>
  <defs>
    <linearGradient id="lkTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="55%"  stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="lkWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F9D6E"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="lkWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="760" height="220" rx="24" fill="#0B1220"/>

  <!-- mark -->
  <g transform="translate(40,42) scale(0.53)">
    <rect width="256" height="256" rx="58" fill="url(#lkTile)"/>
    <path fill="#FFFFFF" d="
      M82 62 h92 a26 26 0 0 1 26 26 v54 a26 26 0 0 1 -26 26 h-52
      l-32 30 a5 5 0 0 1 -8.4 -4.4 l5.4 -25.6 h-5
      a26 26 0 0 1 -26 -26 v-54 a26 26 0 0 1 26 -26 z"/>
    <g fill="url(#lkWave)">
      <rect x="76"  y="103" width="12" height="26" rx="6"/>
      <rect x="98"  y="90"  width="12" height="52" rx="6"/>
      <rect x="120" y="79"  width="12" height="74" rx="6"/>
      <rect x="142" y="94"  width="12" height="44" rx="6"/>
      <rect x="164" y="105" width="12" height="22" rx="6"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
    <text x="212" y="118" font-size="66" font-weight="400" fill="#E8EEF7" letter-spacing="-1">Hey</text>
    <text x="325" y="118" font-size="66" font-weight="800" fill="url(#lkWord)" letter-spacing="-1">Nikki</text>
    <text x="214" y="156" font-size="19" font-weight="600" fill="#7C8CA6" letter-spacing="5.5">NIKKI TECHNOLOGIES</text>
  </g>

  <!-- rule, echoing the waveform gradient -->
  <rect x="214" y="172" width="300" height="3" rx="1.5" fill="url(#lkWord)" opacity="0.55"/>
</svg>
