# Temporary bootstrap config — HTTP-only, no SSL.
#
# WHY THIS EXISTS: nginx.conf (the real config) references Let's
# Encrypt certs that don't exist until certbot has actually issued
# them, and nginx refuses to start AT ALL if any part of the config
# references a missing file — including the unrelated HTTP-only
# server block that's needed to serve the ACME challenge in the first
# place. That's a bootstrapping deadlock: no cert without nginx
# serving the challenge, no nginx without the cert.
#
# USAGE: swap this in for nginx.conf temporarily, restart nginx, run
# certbot (webroot mode against the now-running HTTP server), then
# swap the real nginx.conf back and restart nginx again. See the
# exact commands in SPRINT_GUIDE.md / chat history — not duplicated
# here since it's a one-time bootstrap step, not routine operation.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name api.heynikki.in pipeline.heynikki.in n8n.heynikki.in activepieces.heynikki.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 200 'Hey Nikki — SSL bootstrap in progress.';
            add_header Content-Type text/plain;
        }
    }
}
