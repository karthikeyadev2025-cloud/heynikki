worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=300r/m;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────
    server {
        listen 80;
        server_name api.heynikki.in pipeline.heynikki.in n8n.heynikki.in activepieces.heynikki.in;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── API Server — api.heynikki.in ─────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.heynikki.in;

        ssl_certificate     /etc/letsencrypt/live/api.heynikki.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.heynikki.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # Webhook endpoints — rate limited
        location /webhooks/ {
            limit_req zone=webhooks burst=20 nodelay;
            proxy_pass         http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://127.0.0.1:4000/health;
        }
    }

    # ── Voice Pipeline — pipeline.heynikki.in ────────────────
    server {
        listen 443 ssl http2;
        server_name pipeline.heynikki.in;

        ssl_certificate     /etc/letsencrypt/live/pipeline.heynikki.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pipeline.heynikki.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # WebSocket upgrade for voice streams
        location /ws/ {
            proxy_pass          http://127.0.0.1:8000;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;    # 1 hour — long-running voice calls
            proxy_send_timeout  3600s;
        }

        # HTTP API endpoints
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }
    }

    # ── n8n — n8n.heynikki.in ────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name n8n.heynikki.in;

        ssl_certificate     /etc/letsencrypt/live/n8n.heynikki.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.heynikki.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Restrict n8n to admin IP only (change to your office/VPN IP)
        # allow YOUR_ADMIN_IP;
        # deny all;

        location / {
            proxy_pass          http://127.0.0.1:5678;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            client_max_body_size 50M;
        }
    }

    # ── Activepieces — activepieces.heynikki.in ───────────────
    server {
        listen 443 ssl http2;
        server_name activepieces.heynikki.in;

        ssl_certificate     /etc/letsencrypt/live/activepieces.heynikki.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/activepieces.heynikki.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass          http://127.0.0.1:8080;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "Upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_read_timeout  3600s;
            client_max_body_size 50M;
        }
    }
}
