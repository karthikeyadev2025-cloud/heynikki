version: '3.8'

# ================================================================
# Hey Nikki — Full EC2 Stack
# Run: docker-compose up -d
# ================================================================

services:

  # ── FreeSWITCH SIP Server ────────────────────────────────────
  freeswitch:
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    container_name: heynikki-freeswitch
    restart: always
    network_mode: host          # Required for SIP/RTP NAT traversal
    env_file: .env               # JIO_SIP_*, VI_SIP_*, FREESWITCH_ESL_PASSWORD,
                                  # INTERNAL_SECRET — picked up by conf/vars.xml's
                                  # env-set directives
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./freeswitch/logs:/var/log/freeswitch
      - /tmp/recordings:/tmp/recordings
    environment:
      - FREESWITCH_LOG_LEVEL=warning
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Must pass -p: the ESL password is non-default (vars.xml pulls it
      # from FREESWITCH_ESL_PASSWORD), and bare `fs_cli` tries "ClueCon",
      # fails auth, and the container never becomes healthy — which also
      # blocks voice-pipeline's depends_on: service_healthy.
      # CMD-SHELL (not CMD) so $FREESWITCH_ESL_PASSWORD expands.
      test: ["CMD-SHELL", "fs_cli -p \"$$FREESWITCH_ESL_PASSWORD\" -x status | grep -q ^UP"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Python Voice Pipeline ─────────────────────────────────────
  voice-pipeline:
    build:
      context: ../voice-pipeline
      dockerfile: Dockerfile
    container_name: heynikki-pipeline
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # Nginx proxies externally; never expose raw
    volumes:
      - /tmp/recordings:/tmp/recordings   # shared with FreeSWITCH
    env_file: .env
    environment:
      - PORT=8000
    depends_on:
      freeswitch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'

  # ── Node.js API Server ────────────────────────────────────────
  api-server:
    build:
      context: ../api-server
      dockerfile: Dockerfile
    container_name: heynikki-api
    restart: always
    # network_mode: host, matching freeswitch — NOT a bridged container
    # with a ports: mapping. freeswitch's ESL is bound strictly to
    # 127.0.0.1 (intentionally, for security — see event_socket.conf.xml)
    # which only accepts connections from processes sharing the exact
    # same network namespace as the host. A bridged container reaching
    # in via host.docker.internal/extra_hosts would NOT work here (that
    # resolves to the Docker bridge gateway IP, a different interface
    # than true loopback) — this was tried and reasoned through before
    # landing on network_mode: host as the actual fix.
    network_mode: host
    env_file: .env
    environment:
      - PORT=4000
      # voice-pipeline also publishes at 127.0.0.1:8000 on the host, so
      # this now reaches it the same way api-server reaches freeswitch —
      # NOT via the bridge-network service name "voice-pipeline", which
      # stops resolving once this container leaves the bridge network.
      - PIPELINE_URL=http://127.0.0.1:8000
    depends_on:
      - voice-pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # ── n8n Workflow Automation ───────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: heynikki-n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/backup   # pre-loaded workflows
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.heynikki.in/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168        # keep 7 days of execution logs
      - N8N_LOG_LEVEL=warn
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Pass through secrets for use in workflows
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - WATI_API_KEY=${WATI_API_KEY}
      - WATI_API_URL=${WATI_API_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Activepieces Automation (Alternative Engine) ───────────────
  activepieces:
    image: activepieces/activepieces:latest
    container_name: heynikki-activepieces
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - activepieces_data:/root/.activepieces
    environment:
      - AP_ENCRYPTION_KEY=${ACTIVEPIECES_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${ACTIVEPIECES_JWT_SECRET}
      - AP_FRONTEND_URL=https://activepieces.heynikki.in
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_TELEMETRY_ENABLED=false
      - AP_TEMPLATES_SOURCE_URL=
      # Was crash-looping every ~4s: "Host is required is null or
      # undefined" from createStandaloneRedisConnection — Activepieces
      # defaults to requiring a real Redis server and doesn't fall
      # back gracefully when unset. MEMORY mode is the documented way
      # to run without one — fine for this single-instance setup, but
      # queue/job state resets on container restart. Add a real Redis
      # service + AP_REDIS_HOST/AP_REDIS_PORT instead once this needs
      # to survive restarts without losing in-flight automation state.
      - AP_REDIS_TYPE=MEMORY
      # Same failure mode as AP_REDIS_TYPE above, for the database:
      # with AP_DB_TYPE unset Activepieces defaults to POSTGRES and dies
      # on startup with "SYSTEM_PROP_NOT_DEFINED: AP_POSTGRES_DATABASE".
      # There is no postgres service in this stack, so SQLITE3 is the
      # intended mode — it persists into the activepieces_data volume
      # mounted at /root/.activepieces above. PM2 restarts the app on
      # each crash, so the container reports "running" while nothing
      # ever listens on :80; the healthcheck is what actually catches it.
      - AP_DB_TYPE=SQLITE3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: heynikki-nginx
    restart: always
    # network_mode: host, not a ports: mapping. nginx.conf proxies to
    # 127.0.0.1:4000 / :8000 / :5678 / :8080 for api-server /
    # voice-pipeline / n8n / activepieces — those only resolve
    # correctly if nginx shares the host's network namespace. As a
    # bridged container (the previous setup), nginx's own 127.0.0.1
    # was a separate namespace from all four upstreams, meaning every
    # proxy_pass here was unreachable regardless of whether the
    # upstream service itself was healthy — this is why the earlier
    # "502 Bad Gateway" happened even once api-server was confirmed
    # running clean.
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api-server
      - voice-pipeline
      - n8n
      - activepieces

volumes:
  n8n_data:
    driver: local
  activepieces_data:
    driver: local
