version: '3.8'

# ================================================================
# Hey Nikki — Full EC2 Stack
# Run: docker-compose up -d
# ================================================================

services:

  # ── FreeSWITCH SIP Server ────────────────────────────────────
  freeswitch:
    build:
      context: ./freeswitch
      dockerfile: Dockerfile
    container_name: heynikki-freeswitch
    restart: always
    network_mode: host          # Required for SIP/RTP NAT traversal
    env_file: .env               # JIO_SIP_*, VI_SIP_*, FREESWITCH_ESL_PASSWORD,
                                  # INTERNAL_SECRET — picked up by conf/vars.xml's
                                  # env-set directives
    volumes:
      - ./freeswitch/conf:/etc/freeswitch
      - ./freeswitch/logs:/var/log/freeswitch
      - /tmp/recordings:/tmp/recordings
    environment:
      - FREESWITCH_LOG_LEVEL=warning
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Must pass -p: the ESL password is non-default (vars.xml pulls it
      # from FREESWITCH_ESL_PASSWORD), and bare `fs_cli` tries "ClueCon",
      # fails auth, and the container never becomes healthy — which also
      # blocks voice-pipeline's depends_on: service_healthy.
      # CMD-SHELL (not CMD) so $FREESWITCH_ESL_PASSWORD expands.
      test: ["CMD-SHELL", "fs_cli -p \"$$FREESWITCH_ESL_PASSWORD\" -x status | grep -q ^UP"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Python Voice Pipeline ─────────────────────────────────────
  voice-pipeline:
    build:
      context: ../voice-pipeline
      dockerfile: Dockerfile
    container_name: heynikki-pipeline
    restart: always
    # network_mode: host, not a ports: mapping — same reason nginx uses it.
    # As a bridged container the pipeline's own 127.0.0.1 was a separate
    # namespace from api-server (which is host-mode), so API_SERVER_URL of
    # http://127.0.0.1:4000 resolved to the pipeline itself. Every call
    # logged "routing lookup failed — defaulting to AI", which meant DIDs
    # set to routing_mode=human silently got the bot, transfer-to-human
    # could never fire, and the fallback insert created a duplicate calls
    # row. Dropping the ports: mapping is paired with binding uvicorn to
    # 127.0.0.1 in the pipeline Dockerfile — otherwise host mode would
    # publish it on the public interface.
    network_mode: host
    volumes:
      - /tmp/recordings:/tmp/recordings   # shared with FreeSWITCH
      # Call logs must outlive the container. A rebuild recreates it and
      # Docker discards the container's logs with it, which has already
      # destroyed the evidence from two real calls.
      - ./logs/pipeline:/app/logs
    env_file: .env
    environment:
      - PORT=8000
    depends_on:
      freeswitch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'

  # ── Node.js API Server ────────────────────────────────────────
  api-server:
    build:
      context: ../api-server
      dockerfile: Dockerfile
    container_name: heynikki-api
    restart: always
    # network_mode: host, matching freeswitch — NOT a bridged container
    # with a ports: mapping. freeswitch's ESL is bound strictly to
    # 127.0.0.1 (intentionally, for security — see event_socket.conf.xml)
    # which only accepts connections from processes sharing the exact
    # same network namespace as the host. A bridged container reaching
    # in via host.docker.internal/extra_hosts would NOT work here (that
    # resolves to the Docker bridge gateway IP, a different interface
    # than true loopback) — this was tried and reasoned through before
    # landing on network_mode: host as the actual fix.
    network_mode: host
    env_file: .env
    environment:
      - PORT=4000
      # voice-pipeline also publishes at 127.0.0.1:8000 on the host, so
      # this now reaches it the same way api-server reaches freeswitch —
      # NOT via the bridge-network service name "voice-pipeline", which
      # stops resolving once this container leaves the bridge network.
      - PIPELINE_URL=http://127.0.0.1:8000
    depends_on:
      - voice-pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # ── Scheduled jobs ────────────────────────────────────────────
  # src/jobs/scheduler.ts was written to run as a cron ("*/15 * * * *") on the
  # EC2 box. That box is gone and nothing replaced it, so these three jobs
  # have never run in this deployment:
  #
  #   embed knowledge      — the "Teach Nikki" page writes rows with
  #                          embedding = NULL because embedding needs the
  #                          Gemini key server-side. Until this job runs, RAG
  #                          can never match them, so the knowledge base is
  #                          not merely empty — it cannot work.
  #   appointment reminders — the 24h reminder endpoint exists and was called
  #                          by nothing.
  #   daily summary        — the owner's end-of-day WhatsApp.
  #
  # Same image as api-server, so it ships whatever the API ships. The sleep
  # loop is deliberate over a cron daemon: one process, restart: always, and
  # the interval is visible here rather than in a crontab inside a container.
  # Every job is idempotent (embedding IS NULL, wa_reminder_sent = false,
  # summary keyed by date), so an extra pass is harmless.
  scheduler:
    image: infra-api-server:latest
    container_name: heynikki-scheduler
    restart: always
    network_mode: host          # reaches api-server on 127.0.0.1:4000
    env_file: .env
    environment:
      - API_URL=http://127.0.0.1:4000
    depends_on:
      - api-server
    command: >
      sh -c "while true; do node dist/jobs/scheduler.js || echo '[scheduler] run failed'; sleep 900; done"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # ── Outbound campaign dispatcher ──────────────────────────────
  # DELIBERATELY OPT-IN: start with `--profile outbound`.
  #
  # scrubDnd() in jobs/outbound-dispatcher.ts is still a STUB — it approves
  # every number. Running this against a purchased list would dial numbers on
  # India's DND registry, which is a TRAI violation, not a bug report. Leave
  # it off until a real DND provider is wired in, or until the list is
  # explicitly consented opt-in.
  #
  # It is also single-instance only: recipient rows are not locked during
  # pickup, so two dispatchers would dial the same person twice.
  outbound-dispatcher:
    image: infra-api-server:latest
    container_name: heynikki-outbound
    restart: always
    profiles: ["outbound"]
    network_mode: host
    env_file: .env
    environment:
      - PIPELINE_URL=http://127.0.0.1:8000
    depends_on:
      - api-server
    command: ["node", "dist/jobs/outbound-dispatcher.js"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # ── n8n Workflow Automation ───────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: heynikki-n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/backup   # pre-loaded workflows
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.heynikki.in/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=sqlite
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168        # keep 7 days of execution logs
      - N8N_LOG_LEVEL=warn
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Pass through secrets for use in workflows
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - WATI_API_KEY=${WATI_API_KEY}
      - WATI_API_URL=${WATI_API_URL}
      # The Meta workflows build their whole request from $env.META_WA_*: the
      # send URL takes the phone number id, the Authorization header takes the
      # token. Without these the URL resolves to
      # graph.facebook.com/v21.0//messages with an empty bearer, so every send
      # fails — while the workflow still answers HTTP 200 from its Respond
      # node, which is why this looked healthy from outside.
      - META_WA_TOKEN=${META_WA_TOKEN}
      - META_WA_PHONE_NUMBER_ID=${META_WA_PHONE_NUMBER_ID}
      - META_WA_API_VERSION=${META_WA_API_VERSION}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER}
      # Expressions can read $env only while this is explicitly off.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Activepieces Automation (Alternative Engine) ───────────────
  activepieces:
    image: activepieces/activepieces:latest
    container_name: heynikki-activepieces
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - activepieces_data:/root/.activepieces
    environment:
      - AP_ENCRYPTION_KEY=${ACTIVEPIECES_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${ACTIVEPIECES_JWT_SECRET}
      - AP_FRONTEND_URL=https://activepieces.heynikki.in
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_TELEMETRY_ENABLED=false
      - AP_TEMPLATES_SOURCE_URL=
      # Was crash-looping every ~4s: "Host is required is null or
      # undefined" from createStandaloneRedisConnection — Activepieces
      # defaults to requiring a real Redis server and doesn't fall
      # back gracefully when unset. MEMORY mode is the documented way
      # to run without one — fine for this single-instance setup, but
      # queue/job state resets on container restart. Add a real Redis
      # service + AP_REDIS_HOST/AP_REDIS_PORT instead once this needs
      # to survive restarts without losing in-flight automation state.
      - AP_REDIS_TYPE=MEMORY
      # Same failure mode as AP_REDIS_TYPE above, for the database:
      # with AP_DB_TYPE unset Activepieces defaults to POSTGRES and dies
      # on startup with "SYSTEM_PROP_NOT_DEFINED: AP_POSTGRES_DATABASE".
      # There is no postgres service in this stack, so SQLITE3 is the
      # intended mode — it persists into the activepieces_data volume
      # mounted at /root/.activepieces above. PM2 restarts the app on
      # each crash, so the container reports "running" while nothing
      # ever listens on :80; the healthcheck is what actually catches it.
      - AP_DB_TYPE=SQLITE3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Cloudflare Tunnel ─────────────────────────────────────────
  # Replaces the EC2 box as the public ingress. Outbound-only: cloudflared
  # dials Cloudflare, so this host needs NO open ports, NO static IP and NO
  # TLS certs, and CGNAT stops mattering. That was the only thing EC2
  # uniquely provided.
  #
  # Why the API server stays HERE rather than moving to Vercel: seven routes
  # open a raw TCP socket to FreeSWITCH's event socket on 127.0.0.1:8021
  # (click-to-call, transfer-to-human, live channels, trunk status, hangup,
  # reload). A serverless function cannot hold that socket, and ESL is not
  # HTTP. Six rate limiters and the demo-turn counter also keep state in
  # process memory, which resets on every serverless invocation.
  #
  # Token mode: public hostnames are configured in the Cloudflare dashboard
  # (Zero Trust > Networks > Tunnels), so routing changes need no redeploy.
  # Point them at:
  #     api.heynikki.in          -> http://127.0.0.1:4000
  #     n8n.heynikki.in          -> http://127.0.0.1:5678
  #     activepieces.heynikki.in -> http://127.0.0.1:8080
  # Do NOT expose the voice pipeline (8000) or FreeSWITCH ESL (8021)
  # publicly — the pipeline is reached over loopback by FreeSWITCH and the
  # API server, and ESL has full call control with no rate limiting.
  #
  # Requires TUNNEL_TOKEN in .env. Started explicitly so a missing token
  # cannot crash-loop the stack:
  #     docker compose --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: heynikki-tunnel
    restart: always
    profiles: ["tunnel"]
    network_mode: host          # so 127.0.0.1 means the same as it does to
                                # api-server, n8n and activepieces
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file: .env

  # ── Nginx Reverse Proxy + SSL ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: heynikki-nginx
    restart: always
    # network_mode: host, not a ports: mapping. nginx.conf proxies to
    # 127.0.0.1:4000 / :8000 / :5678 / :8080 for api-server /
    # voice-pipeline / n8n / activepieces — those only resolve
    # correctly if nginx shares the host's network namespace. As a
    # bridged container (the previous setup), nginx's own 127.0.0.1
    # was a separate namespace from all four upstreams, meaning every
    # proxy_pass here was unreachable regardless of whether the
    # upstream service itself was healthy — this is why the earlier
    # "502 Bad Gateway" happened even once api-server was confirmed
    # running clean.
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api-server
      - voice-pipeline
      - n8n
      - activepieces

volumes:
  n8n_data:
    driver: local
  activepieces_data:
    driver: local
